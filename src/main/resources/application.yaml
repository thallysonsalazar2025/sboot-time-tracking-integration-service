spring:
  application:
    name: sboot-time-tracking-integration-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:timetracking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
  rabbitmq:
    publisher-confirm-type: simple

logging:
  pattern:
    level: "%5p [corr:%X{X-Correlation-Id}]"

secullum:
  base-url: http://localhost:8089

resilience:
  secullum:
    timeout-ms: 2500
