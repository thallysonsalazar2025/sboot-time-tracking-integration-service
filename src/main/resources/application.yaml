spring:
  application:
    name: sboot-time-tracking-integration-service
  datasource:
    url: jdbc:h2:mem:timetracking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{X-Correlation-Id}]"

secullum:
  base-url: http://localhost:8089

resilience:
  secullum:
    timeout-ms: 2500
